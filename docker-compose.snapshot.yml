name: aethria-snapshot

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aethria_test
      POSTGRES_USER: aethria
      POSTGRES_PASSWORD: local-test-password
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethria -d aethria_prod_snapshot"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - aethria-prod-snapshot-data:/var/lib/postgresql/data

volumes:
  aethria-prod-snapshot-data:
    external: true
