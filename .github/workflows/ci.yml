name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run JavaScript-based actions on Node 24 (GitHub deprecation of Node 20 actions).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
  SKIP_REFERENCE_URL_VERIFY: "1"
  RESUME_AGENT_LOOPS_ON_STARTUP: "false"

jobs:
  app-frontend:
    name: App frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # main.tsx requires Clerk at build time (import.meta.env is inlined).
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          VITE_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

  web-frontend:
    name: Web frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # Fixed 2026-08-18 (audit HIGH-H14): check:waitlist and check:marketing
      # were defined in package.json but never run in CI. check:waitlist in
      # particular is the only automated guard on api/waitlist.ts's
      # hand-rolled escapeHtml() -- a future edit that weakens it (e.g.
      # "simplifying" the escaping) would ship undetected, reopening HTML
      # injection into the notification email sent via Resend.
      - name: Waitlist escaping/validation checks
        run: npm run check:waitlist

      - name: Build
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_APP_URL: http://127.0.0.1:3000
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Marketing content checks
        run: npm run check:marketing

  app-frontend-e2e:
    name: App frontend smoke E2E
    needs: app-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-front-end/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke E2E
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          VITE_API_URL: http://127.0.0.1:8000
        run: npm run test:e2e

  backend-deps:
    name: Backend dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('backend/requirements.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock pytest pytest-asyncio
          pip install -r backend/requirements-legacy.txt

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock

  backend-import:
    name: Backend import check
    needs: backend-deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('backend/requirements.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify imports
        run: python -c "import api"

  backend-tests:
    name: Backend tests
    needs: backend-deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('backend/requirements.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock pytest pytest-asyncio
          pip install -r requirements-legacy.txt

      - name: Run tests
        working-directory: .
        run: python -m pytest backend/tests/ -v -o asyncio_mode=auto

  backend-postgres-contracts:
    name: Backend PostgreSQL contracts
    needs: backend-deps
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aethria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aethria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aethria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.lock pytest pytest-asyncio
          pip install -r backend/requirements-legacy.txt
      - name: Apply institutional migrations
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role;"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            create schema if not exists auth;
            create or replace function auth.uid() returns uuid language sql stable as \$\$ select null::uuid \$\$;
            create or replace function auth.jwt() returns jsonb language sql stable as \$\$ select '{}'::jsonb \$\$;
            create or replace function auth.role() returns text language sql stable as \$\$ select null::text \$\$;
          "
          for migration in \
            supabase/migrations/20260314000005_aethria_tables_from_code.sql \
            supabase/migrations/20260314000006_add_user_id_to_tables.sql \
            supabase/migrations/20260413000001_add_meta_churn_signals.sql \
            supabase/migrations/20260417000002_pipeline_activity.sql \
            supabase/migrations/20260401000003_lookup_job_outcomes.sql \
            supabase/migrations/20260526000001_security_limits.sql \
            supabase/migrations/20260715193000_durable_agent_jobs.sql \
            supabase/migrations/20260715210000_canonical_identity.sql \
            supabase/migrations/20260715220000_agent_job_block_details.sql \
            supabase/migrations/20260715230000_evidence_claim_ledger.sql \
            supabase/migrations/20260715240000_immutable_evaluations.sql \
            supabase/migrations/20260715250000_rulings_and_actions.sql \
            supabase/migrations/20260715260000_attention_enrichment.sql \
            supabase/migrations/20260715270000_fund_intelligence.sql \
            supabase/migrations/20260715280000_channels_outcomes.sql \
            supabase/migrations/20260716090000_review_fixes.sql \
            supabase/migrations/20260721150000_lookup_job_outcomes_rls.sql \
            supabase/migrations/20260722090000_authority_control.sql \
            supabase/migrations/20260725120000_canonical_portfolio_positions.sql \
            supabase/migrations/20260725130000_triage_assessments.sql \
            supabase/migrations/20260804000001_security_limits_privilege_hardening.sql \
            supabase/migrations/20260804000002_legacy_tenant_tables_rls.sql \
            supabase/migrations/20260804000003_portfolio_startups_feed_cache_rejection_patterns.sql \
            supabase/migrations/20260812000001_durable_retrieval_cache.sql \
            supabase/migrations/20260812000002_evaluation_judgment_audit.sql \
            supabase/migrations/20260812000003_canonical_people.sql \
            supabase/migrations/20260812000004_external_entity_mappings.sql \
            supabase/migrations/20260812000005_canonical_competition.sql \
            supabase/migrations/20260814000007_rls_auto_enable_privilege_hardening.sql
          do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Apply provider-neutral migrations
        run: python backend/scripts/migrate_postgres.py --database-url "$TEST_DATABASE_URL"
      - name: Run migrated PostgreSQL scenarios
        working-directory: backend
        run: >-
          python -m pytest
          tests/jobs/test_job_repository_postgres.py
          tests/identity/test_identity_repository_postgres.py
          tests/fund_intelligence/test_fund_intelligence_postgres.py
          tests/thesis/test_repository_postgres.py
          tests/security/test_security_repository_postgres.py
          tests/settings/test_settings_loader_postgres.py
          tests/test_job_schedule.py
          -v -o asyncio_mode=auto

  backend-docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Docker build files are present
        run: |
          test -f backend/Dockerfile || {
            echo "::error::backend/Dockerfile is missing from the repository. Commit backend/Dockerfile and .dockerignore."
            exit 1
          }
          test -d resources || {
            echo "::error::resources/ is missing from the repository (required by backend/Dockerfile COPY)."
            exit 1
          }

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: aethria-backend:ci
          load: true
