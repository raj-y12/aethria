# Railway config for the Aethria backend API (Docker).
# Frontends stay on Vercel; only backend/** and resources/** should trigger deploys.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "resources/**", "railway.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
