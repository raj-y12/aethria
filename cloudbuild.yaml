serviceAccount: projects/$PROJECT_ID/serviceAccounts/cloud-build-deployer@$PROJECT_ID.iam.gserviceaccount.com

steps:
  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - backend/Dockerfile
      - --tag
      - europe-west1-docker.pkg.dev/$PROJECT_ID/aethria-backend/backend:$COMMIT_SHA
      - .

  - id: push-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/aethria-backend/backend:$COMMIT_SHA

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aethria-backend
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/aethria-backend/backend:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --service-account=cloud-run-backend@$PROJECT_ID.iam.gserviceaccount.com
      - --env-vars-file=cloudrun.env.yaml
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,FIRECRAWL_API_KEY=FIRECRAWL_API_KEY:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,DATABASE_URL=DATABASE_URL:latest
      - --no-invoker-iam-check
      - --ingress=all
      - --min=1
      # Single instance: per-user agent loops are process-local asyncio tasks
      # (api.py _per_user_loops) and RESUME_AGENT_LOOPS_ON_STARTUP=false, so a
      # loop owned by a second instance dies with it and is never resumed.
      - --max=1
      # >1 because an open SSE stream (GET /api/stream) holds a request slot for
      # its lifetime; at concurrency=1 it starves every other call on the instance.
      - --concurrency=8
      - --no-cpu-throttling
      - --cpu=1
      - --memory=2Gi
      - --timeout=900s
      - --quiet

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/aethria-backend/backend:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
